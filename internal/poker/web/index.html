<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线德州扑克</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/cards.js"></script>
  <script defer src="/chips.js"></script>
  <script defer src="/voice.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main class="poker-app">
    <header class="app-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">♠</span><div><h1>在线德州扑克</h1><span class="eyebrow">TEXAS POKER</span></div></div>
      <section class="status-bar" aria-label="牌局与连接状态"><div class="headline"><strong id="game-info">等待房主开始</strong><span id="countdown" aria-live="off"></span></div><p id="status" role="status" aria-live="polite">正在连接房间…</p></section>
      <div class="header-controls"><button id="sound-toggle" type="button">启用声音</button><label class="volume-control">音量<input id="volume" type="range" min="0" max="100" value="60" aria-label="播报音量"></label><button id="retry" type="button">重新连接</button><button id="leave" type="button" disabled>退出房间</button></div>
    </header>
    <div class="play-layout">
      <details class="hand-reference" open><summary>牌型参考 <span>强 → 弱</span></summary><div id="reference-list"></div></details>
      <div class="workspace"><section class="table" aria-label="深红牌桌 · 最多五位玩家"><div id="seats" class="seats"></div></section>
        <section class="action-panel" aria-labelledby="action-title"><div class="action-label"><h2 id="action-title">你的操作</h2><p id="command-status" role="status" aria-live="polite" hidden></p><p id="action-hint" hidden></p></div><div id="actions" aria-label="游戏操作"></div></section>
      </div>
      <section id="results" class="results-panel" aria-label="本局结算结果"></section>
    </div>
    <footer class="app-footer"><span>断线重新进入后筹码补回 100；服务重启会清空本房间。</span><span id="voice-status" role="status">中文声音待启用</span></footer>
  </main>
</body>
</html>
