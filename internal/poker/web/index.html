<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线德州扑克</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/cards.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">TEXAS POKER</span><h1>在线德州扑克</h1></header>
    <section class="status-bar" aria-label="牌局与连接状态">
      <div><p id="game-info">等待房主开始</p><p id="countdown" aria-live="off"></p><p id="command-status" role="status" aria-live="polite" hidden></p><p id="status" role="status" aria-live="polite">正在连接房间…</p></div>
      <div class="connection-actions"><button id="leave" type="button" disabled>退出房间</button><button id="retry" type="button">重新连接</button></div>
    </section>
    <div class="play-layout">
      <details class="hand-reference" open><summary>牌型参考 <span>强 → 弱</span></summary><div id="reference-list"></div></details>
      <section class="table" aria-label="牌桌">
        <div class="table-label">唯一房间 · 最多五名真人</div>
        <div id="seats" class="seats"></div>
        <section class="action-panel" aria-labelledby="action-title"><h2 id="action-title">你的操作</h2><div id="actions" aria-label="游戏操作"></div></section>
        <section id="results" class="results-panel" aria-label="本局结算结果" hidden></section>
      </section>
    </div>
    <p class="hint">断线重新进入后筹码补回 100；服务重启会清空本房间。</p>
  </main>
</body>
</html>
