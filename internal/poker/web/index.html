<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线德州扑克</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">TEXAS POKER</span><h1>在线德州扑克</h1></header>
    <p id="status" role="status" aria-live="polite">正在连接房间…</p>
    <section class="table" aria-label="牌桌">
      <div class="table-label">唯一房间 · 最多两名真人</div>
      <div id="seats" class="seats"></div>
      <p id="game-info"></p>
      <div id="actions" aria-label="游戏操作"></div>
    </section>
    <button id="retry" type="button">重新连接</button>
    <p class="hint">断线重新进入后筹码补回 100；服务重启会清空本房间。</p>
  </main>
</body>
</html>
