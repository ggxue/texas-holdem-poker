<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sequence diagram</title>
  <link rel="stylesheet" href="/doc/viewer.css">
  <script defer src="/doc/viewer.js"></script>
</head>
<body>
  <nav class="zoom-controls" aria-label="Image zoom controls">
    <output id="zoom-level" aria-live="polite">100%</output>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-reset" type="button">Reset</button>
  </nav>
  <img id="diagram" src="/doc/sequence-diagram-image.png" alt="Sequence diagram">
</body>
</html>
